#:schema node_modules/wrangler/config-schema.json
name = "laburen-challenge-mcp"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Durable Object para transporte SSE/Streamable HTTP del MCP
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "LaburenMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LaburenMCP"]

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "laburen-challenge-db"
database_id = "91a940ad-ee7e-4fa8-b853-950e5e5880ae"

# Variables de entorno
[vars]
CHATWOOT_BASE_URL = "https://chatwootchallenge.laburen.com"
CHATWOOT_ACCOUNT_ID = "102"
# ENVIRONMENT = "production"

# Secrets (configurar con `wrangler secret put`):
# CHATWOOT_API_TOKEN → User Access Token de Chatwoot
